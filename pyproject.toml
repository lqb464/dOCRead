[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DOCRead"
version = "2.0.0"
description = "Deep Learning OCR Training Pipeline (CRNN + TrOCR)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.38.0",
    "numpy>=1.24",
    "Pillow>=9.5.0",
    "opencv-python-headless>=4.8.0",
    "trdg>=1.8.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.9",
    "mlflow>=2.10.0,<3",
    "python-Levenshtein>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=23.0",
    "flake8>=6.0",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
